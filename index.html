function emp(id){return APP.employees.find(e=>e.id===Number(id))}
function userByEmp(id){return store.users().find(u=>u.employeeId===Number(id))}
function currentUser(){return APP.session?store.users().find(u=>u.id===APP.session.userId):null}
function isAdmin(u=currentUser()){return !!u&&APP.adminRoles.includes(u.role)}
function audit(action,targetType,targetId,details={}){const u=currentUser(); const a=store.audits();a.unshift({id:uid(),actorId:u?.id||'system',action,targetType,targetId,details,at:new Date().toISOString()});store.set(KEYS.audits,a.slice(0,1000))}
async function hashPin(pin,salt){const raw=new TextEncoder().encode(`${salt}:${pin}`);const digest=await crypto.subtle.digest('SHA-256',raw);return [...new Uint8Array(digest)].map(b=>b.toString(16).padStart(2,'0')).join('')}
function toast(msg,type='ok'){sessionStorage.setItem('cbe_notice',JSON.stringify({msg,type}));}
function pullNotice(){try{const n=JSON.parse(sessionStorage.getItem('cbe_notice'));sessionStorage.removeItem('cbe_notice');return n}catch{return null}}

// IndexedDB photo storage for the self-contained HTML demo.
const PHOTO_DB='cbe_ponto_photos_v1';
function photoDb(){return new Promise((res,rej)=>{const r=indexedDB.open(PHOTO_DB,1);r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains('photos'))r.result.createObjectStore('photos')};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function savePhoto(blob){const id=uid();const db=await photoDb();await new Promise((res,rej)=>{const tx=db.transaction('photos','readwrite');tx.objectStore('photos').put(blob,id);tx.oncomplete=res;tx.onerror=()=>rej(tx.error)});db.close();return id}
async function getPhoto(id){if(!id)return null;const db=await photoDb();const val=await new Promise((res,rej)=>{const r=db.transaction('photos').objectStore('photos').get(id);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});db.close();return val||null}
async function compressImage(file){if(!file)return null;if(!file.type.startsWith('image/'))throw new Error('Selecione uma imagem.');if(file.size>10*1024*1024)throw new Error('A imagem deve ter no máximo 10 MB.');const img=await createImageBitmap(file);const max=1280,scale=Math.min(1,max/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.round(img.width*scale);c.height=Math.round(img.height*scale);c.getContext('2d').drawImage(img,0,0,c.width,c.height);const blob=await new Promise(r=>c.toBlob(r,'image/jpeg',.76));img.close();return blob}

function ensureBootstrap(){

  if(!localStorage.getItem(KEYS.entries)) store.set(KEYS.entries,[]);
  if(!localStorage.getItem(KEYS.audits)) store.set(KEYS.audits,[]);
}

function noticeHtml(){const n=pullNotice();return n?`<div class="notice ${esc(n.type)}">${esc(n.msg)}</div>`:''}
function layout(content){const u=currentUser();const display=u?.role==='superadmin'?'Administrador':(emp(u?.employeeId)?.name||u?.username||'');const adminSwitch=isAdmin(u)?(APP.view==='employee'?`<button class="btn ghost small" data-action="admin-panel">Painel administrativo</button>`:`<button class="btn primary small" data-action="my-point">Meu ponto</button>`):'';return `<div class="app-shell"><header class="topbar"><div class="brand">${logo()}<div class="brand-text"><b>Core Beauty Essence</b><span>Controle de Ponto</span></div></div><div class="top-actions">${adminSwitch}<div class="user-pill">${esc(display)}</div><button class="btn ghost small" data-action="logout">Sair</button></div></header><main class="container">${content}<div class="footer">Core Beauty Essence • Sistema acadêmico de controle de ponto</div></main></div>`}
function go(view){APP.view=view;render()}

function loginView(){
  document.getElementById('app').innerHTML=`<div class="auth-wrap"><div class="auth-layout"><section class="auth-visual"><div class="logo-panel">${logo()}<p>Registro simples, visual e organizado para acompanhamento do ponto pela equipe de Recursos Humanos.</p></div></section><section class="auth-card">${noticeHtml()}<div class="mobile-login-logo">${logo()}</div><div class="eyebrow">Controle de Ponto</div><h1>Bem-vindo(a)</h1><p class="lead">Acesse com seu <b>nome completo</b> e PIN de 4 números.</p><form id="loginForm"><label>Usuário</label><input class="field" name="username" list="employeeNames" autocomplete="username" required placeholder="Digite ou selecione seu nome"><datalist id="employeeNames">${APP.employees.map(e=>`<option value="${esc(e.name)}"></option>`).join('')}</datalist><label>PIN</label><input class="field" name="pin" inputmode="numeric" pattern="[0-9]{4}" minlength="4" maxlength="4" type="password" oninput="this.value=this.value.replace(/[^0-9]/g,'').slice(0,4)" autocomplete="current-password" required placeholder="••••"><button class="btn primary full">Entrar</button></form><div class="auth-foot"><small>Todos os funcionários já estão cadastrados.<br>PIN inicial da demonstração: <b>1234</b></small></div></section></div></div>`;
  $('#loginForm').onsubmit=loginSubmit;
}
async function loginSubmit(ev){ev.preventDefault();const fd=new FormData(ev.currentTarget);const login=usernameKey(fd.get('username')),pin=String(fd.get('pin'));
  if(!/^\d{4}$/.test(pin)){toast('O PIN deve ter exatamente 4 números.','danger');return render()}
  const users=store.users(),u=users.find(x=>(x.loginKey||usernameKey(x.username))===login);if(!u){toast('Nome completo ou PIN incorreto.','danger');return render()}
  if(u.status!=='active'){toast('Este acesso está bloqueado.','warn');return render()}
  const h=await hashPin(pin,u.salt);if(h!==u.pinHash){toast('Nome completo ou PIN incorreto.','danger');return render()}
  APP.session={userId:u.id};APP.view=APP.adminRoles.includes(u.role)?'admin':'employee';audit('login','user',u.id);render();
}
function employeeView(){const u=currentUser();const e=emp(u.employeeId);const today=localDate(new Date());const entries=store.entries().filter(x=>x.employeeId===e.id&&x.punchedAt.slice(0,10)===today).sort((a,b)=>a.punchedAt.localeCompare(b.punchedAt));const stat=dayStatus(entries);const next=APP.punchTypes[Math.min(entries.length,3)];const recent=store.entries().filter(x=>x.employeeId===e.id).sort((a,b)=>b.punchedAt.localeCompare(a.punchedAt)).slice(0,16);const content=`${noticeHtml()}<div class="page-title"><div><h1>Olá, ${esc(e.name.split(' ')[0])}</h1><p>${esc(e.job)} • acompanhe suas marcações de hoje.${isAdmin(u)?' Você também possui acesso ao painel administrativo.':''}</p></div><div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">${isAdmin(u)?'<span class="admin-badge">Acesso administrativo</span>':''}<span class="status ${stat.cls}">${stat.label}</span></div></div><div class="grid two"><section class="card clock-card"><div class="date" id="liveDate"></div><div class="clock" id="liveClock">--:--:--</div><div class="next-punch">Próxima marcação: <b>${entries.length>=4?'Registro adicional':APP.labels[next]}</b></div><form id="punchForm" style="text-align:left;margin-top:20px"><input type="hidden" name="punchType" value="${next}"><label>Foto obrigatória</label><div class="photo-box"><input id="photoInput" type="file" name="photo" accept="image/*" capture="user" required><small style="color:var(--muted)">No celular, você pode abrir a câmera diretamente.</small><img class="preview" id="photoPreview" alt="Prévia da foto"></div><label>Observação <span style="font-weight:400;color:var(--muted)">(opcional)</span></label><textarea name="note" rows="2" placeholder="Ex.: retorno de visita externa"></textarea><button type="submit" class="btn primary full">Registrar ${entries.length>=4?'marcação adicional':APP.labels[next]}</button></form></section><section class="card"><div class="section-head"><div><h2>Hoje</h2><p>Marcações realizadas em ${fmtDate(today)}.</p></div></div>${entries.length?`<div class="timeline">${entries.map(x=>timelineEntry(x)).join('')}</div>`:`<div class="empty">Nenhuma marcação registrada hoje.</div>`}</section></div><section class="card"><div class="section-head"><div><h2>Meu histórico</h2><p>Últimas marcações registradas.</p></div></div>${recent.length?`<div class="table-wrap"><table><thead><tr><th>Data</th><th>Horário</th><th>Tipo</th><th>Observação</th><th>Foto</th></tr></thead><tbody>${recent.map(x=>`<tr><td>${fmtDate(x.punchedAt.slice(0,10))}</td><td>${fmtTime(x.punchedAt)}</td><td>${esc(APP.labels[x.punchType])}${x.edited?'<small>ajustado pelo RH</small>':''}</td><td>${esc(x.note||'—')}</td><td>${x.photoId?`<button class="btn ghost small" data-photo="${x.photoId}">Ver foto</button>`:'—'}</td></tr>`).join('')}</tbody></table></div>`:`<div class="empty">Seu histórico aparecerá aqui.</div>`}</section>`;document.getElementById('app').innerHTML=layout(content);startClock();$('#punchForm').onsubmit=punchSubmit;$('#photoInput').onchange=previewPhoto}
function timelineEntry(x){return `<div class="timeline-item"><span class="dot"></span><div><b>${esc(APP.labels[x.punchType])}</b><small>${fmtTime(x.punchedAt)}${x.note?' • '+esc(x.note):''}${x.edited?' • ajustado pelo RH':''}</small></div>${x.photoId?`<button class="btn ghost small" data-photo="${x.photoId}">Foto</button>`:''}</div>`}
function startClock(){const tick=()=>{const d=new Date();if($('#liveDate'))$('#liveDate').textContent=new Intl.DateTimeFormat('pt-BR',{weekday:'long',day:'2-digit',month:'long',year:'numeric'}).format(d);if($('#liveClock'))$('#liveClock').textContent=`${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`};tick();clearInterval(window.__clock);window.__clock=setInterval(tick,1000)}
function previewPhoto(ev){const f=ev.target.files?.[0],img=$('#photoPreview');if(!f||!img)return;const url=URL.createObjectURL(f);img.src=url;img.style.display='block';img.onload=()=>URL.revokeObjectURL(url)}
async function punchSubmit(ev){ev.preventDefault();const btn=ev.currentTarget.querySelector('button[type="submit"], button:not([type])');try{if(btn){btn.disabled=true;btn.textContent='Registrando...';}const fd=new FormData(ev.currentTarget),file=fd.get('photo');if(!(file instanceof File)||!file.size)throw new Error('A foto é obrigatória.');const blob=await compressImage(file),photoId=await savePhoto(blob);const u=currentUser(),e=emp(u.employeeId);const entries=store.entries();entries.push({id:uid(),employeeId:e.id,userId:u.id,punchType:String(fd.get('punchType')),punchedAt:new Date().toISOString(),note:String(fd.get('note')||'').trim(),photoId,edited:false,createdAt:new Date().toISOString()});store.set(KEYS.entries,entries);audit('punch_created','entry',entries.at(-1).id,{employee:e.name});toast('Ponto registrado com sucesso.','ok');render()}catch(err){toast(err.message||'Não foi possível registrar o ponto.','danger');render()}}
function dayStatus(entries){const types=entries.map(e=>e.punchType);if(!types.length)return {label:'Sem registro',cls:'muted'};if(types.length===4&&types.every((t,i)=>t===APP.punchTypes[i]))return {label:'Correto',cls:'ok'};if(types.length<4)return {label:'Incompleto',cls:'warn'};if(types.slice(0,4).some((t,i)=>t!==APP.punchTypes[i]))return {label:'Sequência divergente',cls:'danger'};return {label:'Batida extra',cls:'warn'}}

function adminUser(){return currentUser()}
function adminView(){const u=adminUser();if(!u){APP.session=null;return go('login')}const tabs=[['overview','Visão geral'],['records','Registros'],['access','Acessos'],['audit','Auditoria'],['settings','Configuração']];const nav=`<div class="navtabs">${tabs.map(([id,l])=>`<button data-admin-tab="${id}" class="${APP.adminTab===id?'active':''}">${l}</button>`).join('')}</div>`;let body='';if(APP.adminTab==='overview')body=adminOverview();if(APP.adminTab==='records')body=adminRecords();if(APP.adminTab==='access')body=adminAccess();if(APP.adminTab==='audit')body=adminAudit();if(APP.adminTab==='settings')body=adminSettings();document.getElementById('app').innerHTML=layout(`${noticeHtml()}<div class="page-title"><div><h1>Painel Administrativo</h1><p>Monitoramento do ponto • RH e Gerência Geral. Use “Meu ponto” para registrar suas próprias marcações.</p></div><span class="admin-badge">Acesso administrativo</span></div>${nav}${body}`);bindAdminForms()}
function entriesOn(date){return store.entries().filter(x=>x.punchedAt.slice(0,10)===date)}
function adminOverview(){const date=localDate(new Date()),all=entriesOn(date),statuses=APP.employees.map(e=>({e,s:dayStatus(all.filter(x=>x.employeeId===e.id))}));const activeUsers=store.users().filter(u=>u.status==='active').length;const ok=statuses.filter(x=>x.s.label==='Correto').length;const incomplete=statuses.filter(x=>['Incompleto','Sequência divergente','Batida extra'].includes(x.s.label)).length;return `<div class="grid metrics"><div class="metric"><span>Funcionários</span><strong>${APP.employees.length}</strong></div><div class="metric ok"><span>Ponto correto</span><strong>${ok}</strong></div><div class="metric warn"><span>Com atenção</span><strong>${incomplete}</strong></div><div class="metric"><span>Acessos ativos</span><strong>${activeUsers}</strong></div></div><section class="card"><div class="section-head"><div><h2>Situação de hoje</h2><p>${fmtDate(date)} • atualização local deste navegador.</p></div><button class="btn ghost small" data-action="export-csv">Exportar CSV</button></div><div class="table-wrap"><table><thead><tr><th>Funcionário</th><th>Cargo</th><th>Marcações</th><th>Situação</th><th>Última batida</th></tr></thead><tbody>${statuses.map(({e,s})=>{const rows=all.filter(x=>x.employeeId===e.id).sort((a,b)=>a.punchedAt.localeCompare(b.punchedAt));return `<tr><td><b>${esc(e.name)}</b>${APP.adminRoles.includes(e.role)?'<small>Acesso administrativo</small>':''}</td><td>${esc(e.job)}</td><td>${rows.length}</td><td><span class="status ${s.cls}">${s.label}</span></td><td>${rows.length?fmtTime(rows.at(-1).punchedAt):'—'}</td></tr>`}).join('')}</tbody></table></div></section>`}
function adminRecords(){const selected=sessionStorage.getItem('cbe_filter_date')||localDate(new Date()),empFilter=Number(sessionStorage.getItem('cbe_filter_emp')||0);let rows=store.entries().filter(x=>x.punchedAt.slice(0,10)===selected);if(empFilter)rows=rows.filter(x=>x.employeeId===empFilter);rows.sort((a,b)=>a.punchedAt.localeCompare(b.punchedAt));return `<section class="card"><div class="section-head"><div><h2>Registros de ponto</h2><p>Consulte fotos e faça ajustes com justificativa.</p></div><button class="btn primary small" data-action="manual-entry">+ Nova marcação</button></div><div class="filters"><div><label>Data</label><input id="filterDate" type="date" value="${selected}"></div><div><label>Funcionário</label><select id="filterEmp"><option value="0">Todos</option>${APP.employees.map(e=>`<option value="${e.id}" ${empFilter===e.id?'selected':''}>${esc(e.name)}</option>`).join('')}</select></div><div class="compact"><button class="btn ghost" data-action="apply-filter">Aplicar</button></div></div>${rows.length?`<div class="table-wrap"><table><thead><tr><th>Funcionário</th><th>Horário</th><th>Tipo</th><th>Observação</th><th>Foto</th><th>Ações</th></tr></thead><tbody>${rows.map(x=>{const e=emp(x.employeeId);return `<tr><td><b>${esc(e.name)}</b><small>${esc(e.job)}</small></td><td>${fmtTime(x.punchedAt)}${x.edited?'<small>ajustado</small>':''}</td><td>${esc(APP.labels[x.punchType])}</td><td>${esc(x.note||'—')}</td><td>${x.photoId?`<button class="btn ghost small" data-photo="${x.photoId}">Ver foto</button>`:'<small>registro manual</small>'}</td><td><div class="actions"><button class="btn ghost small" data-edit-entry="${x.id}">Editar</button><button class="btn danger small" data-delete-entry="${x.id}">Excluir</button></div></td></tr>`}).join('')}</tbody></table></div>`:`<div class="empty">Nenhum registro encontrado para os filtros selecionados.</div>`}</section>`}
function adminAccess(){const active=store.users().filter(u=>u.status==='active');return `<section class="card"><div class="section-head"><div><h2>Acessos dos funcionários</h2><p>Todos os colaboradores já estão cadastrados. O usuário é o nome completo e o PIN inicial é 1234.</p></div></div>${active.length?`<div class="table-wrap"><table><thead><tr><th>Funcionário</th><th>Usuário</th><th>Perfil</th><th>Status</th></tr></thead><tbody>${active.map(u=>{const e=emp(u.employeeId);return `<tr><td><b>${esc(e?.name||'')}</b><small>${esc(e?.job||'')}</small></td><td>${esc(u.username)}</td><td>${APP.adminRoles.includes(u.role)?'<span class="admin-badge">Administrativo</span>':'Colaborador'}</td><td><span class="status ok">Ativo</span></td></tr>`}).join('')}</tbody></table></div>`:`<div class="empty">Nenhum acesso ativo.</div>`}</section>`}
function adminAudit(){const aud=store.audits().slice(0,150);const users=store.users();function actor(id){if(id==='bootstrap'||!id)return 'Administrador';const u=users.find(x=>x.id===id);return emp(u?.employeeId)?.name||u?.username||'Sistema'}return `<section class="card"><div class="section-head"><div><h2>Trilha de auditoria</h2><p>Registro das principais ações administrativas e de ponto.</p></div></div>${aud.length?`<div class="table-wrap"><table><thead><tr><th>Data/hora</th><th>Responsável</th><th>Ação</th><th>Detalhes</th></tr></thead><tbody>${aud.map(a=>`<tr><td>${fmtDT(a.at)}</td><td>${esc(actor(a.actorId))}</td><td>${esc(a.action)}</td><td><small>${esc(JSON.stringify(a.details||{}))}</small></td></tr>`).join('')}</tbody></table></div>`:`<div class="empty">Nenhuma ação registrada ainda.</div>`}</section>`}
function adminSettings(){return `<section class="card"><div class="section-head"><div><h2>Armazenamento de fotos</h2><p>Configuração desta versão HTML.</p></div></div><div class="cloud-note"><div style="font-size:24px">☁️</div><div><strong>Modo de demonstração: armazenamento local no navegador</strong><p>As fotos são salvas no IndexedDB do navegador, separadas dos dados de ponto. Isso permite abrir o sistema somente pelo arquivo HTML, sem servidor. Para uso real em vários computadores/celulares, é necessário conectar um backend e uma nuvem privada (por exemplo AWS S3, Cloudflare R2 ou Supabase Storage) para centralizar os dados com autenticação segura.</p></div></div><div style="height:14px"></div><button class="btn ghost" data-action="download-backup">Baixar backup dos dados</button> <button class="btn danger" data-action="reset-demo">Limpar dados da demonstração</button></section>`}
function bindAdminForms(){ }

function showEditEntry(id){const x=store.entries().find(e=>e.id===id);if(!x)return;const e=emp(x.employeeId);showDialog(`<h3>Editar marcação</h3><p class="role-note">${esc(e.name)} • informe uma justificativa para manter a trilha de auditoria.</p><form id="editEntryForm"><input type="hidden" name="id" value="${x.id}"><div class="row"><div><label>Data e hora</label><input type="datetime-local" name="punchedAt" value="${dtLocal(new Date(x.punchedAt))}" required></div><div><label>Tipo</label><select name="punchType">${APP.punchTypes.map(t=>`<option value="${t}" ${x.punchType===t?'selected':''}>${APP.labels[t]}</option>`).join('')}</select></div></div><label>Observação</label><textarea name="note" rows="2">${esc(x.note||'')}</textarea><label>Justificativa do ajuste</label><textarea name="reason" rows="2" required placeholder="Ex.: colaborador esqueceu de registrar retorno"></textarea><div class="dialog-footer"><button type="button" class="btn ghost" data-action="close-dialog">Cancelar</button><button class="btn primary">Salvar ajuste</button></div></form>`);$('#editEntryForm').onsubmit=editEntrySubmit}
function editEntrySubmit(ev){ev.preventDefault();const fd=new FormData(ev.currentTarget),id=String(fd.get('id')),entries=store.entries(),x=entries.find(e=>e.id===id);if(!x)return;const before={punchedAt:x.punchedAt,punchType:x.punchType,note:x.note};x.punchedAt=new Date(String(fd.get('punchedAt'))).toISOString();x.punchType=String(fd.get('punchType'));x.note=String(fd.get('note')||'').trim();x.edited=true;x.editedAt=new Date().toISOString();x.editReason=String(fd.get('reason')).trim();store.set(KEYS.entries,entries);audit('punch_edited','entry',id,{before,after:{punchedAt:x.punchedAt,punchType:x.punchType,note:x.note},reason:x.editReason});closeDialog();toast('Marcação ajustada e registrada na auditoria.','ok');render()}
function showManualEntry(){showDialog(`<h3>Nova marcação manual</h3><p class="role-note">Use quando for necessário regularizar um ponto. A inclusão ficará registrada na auditoria.</p><form id="manualEntryForm"><label>Funcionário</label><select name="employeeId" required><option value="">Selecione</option>${APP.employees.map(e=>`<option value="${e.id}">${esc(e.name)}</option>`).join('')}</select><div class="row"><div><label>Data e hora</label><input name="punchedAt" type="datetime-local" value="${dtLocal(new Date())}" required></div><div><label>Tipo</label><select name="punchType">${APP.punchTypes.map(t=>`<option value="${t}">${APP.labels[t]}</option>`).join('')}</select></div></div><label>Observação</label><textarea name="note" rows="2"></textarea><label>Justificativa</label><textarea name="reason" rows="2" required></textarea><div class="dialog-footer"><button type="button" class="btn ghost" data-action="close-dialog">Cancelar</button><button class="btn primary">Adicionar marcação</button></div></form>`);$('#manualEntryForm').onsubmit=manualEntrySubmit}
function manualEntrySubmit(ev){ev.preventDefault();const fd=new FormData(ev.currentTarget),entries=store.entries(),entry={id:uid(),employeeId:Number(fd.get('employeeId')),userId:adminUser().id,punchType:String(fd.get('punchType')),punchedAt:new Date(String(fd.get('punchedAt'))).toISOString(),note:String(fd.get('note')||'').trim(),photoId:null,edited:true,manual:true,createdAt:new Date().toISOString()};entries.push(entry);store.set(KEYS.entries,entries);audit('manual_punch_created','entry',entry.id,{employee:emp(entry.employeeId).name,reason:String(fd.get('reason'))});closeDialog();toast('Marcação manual adicionada.','ok');render()}
function showDialog(html){document.getElementById('modalRoot').innerHTML=`<div class="dialog-backdrop"><div class="dialog">${html}</div></div>`}
function closeDialog(){document.getElementById('modalRoot').innerHTML=''}
async function showPhoto(id){const blob=await getPhoto(id);if(!blob){toast('Foto não encontrada neste navegador.','warn');return render()}const url=URL.createObjectURL(blob);document.getElementById('modalRoot').innerHTML=`<div class="photo-modal" data-action="close-photo"><button class="btn ghost" data-action="close-photo">Fechar</button><img src="${url}" alt="Foto do registro de ponto"></div>`;$('#modalRoot img').onload=()=>{};document.getElementById('modalRoot').dataset.url=url}
function closePhoto(){const root=document.getElementById('modalRoot'),url=root.dataset.url;if(url)URL.revokeObjectURL(url);root.innerHTML='';delete root.dataset.url}
function exportCsv(){const rows=store.entries().sort((a,b)=>a.punchedAt.localeCompare(b.punchedAt));const lines=[['Funcionário','Cargo','Data','Hora','Tipo','Observação','Ajustado']].concat(rows.map(x=>{const e=emp(x.employeeId),d=new Date(x.punchedAt);return[e.name,e.job,localDate(d),`${pad(d.getHours())}:${pad(d.getMinutes())}`,APP.labels[x.punchType],x.note||'',x.edited?'Sim':'Não']}));const csv='\ufeff'+lines.map(r=>r.map(v=>'"'+String(v).replaceAll('"','""')+'"').join(';')).join('\r\n');downloadBlob(new Blob([csv],{type:'text/csv;charset=utf-8'}),'ponto_core_beauty.csv')}
function downloadBackup(){const backup={version:1,exportedAt:new Date().toISOString(),employees:APP.employees,users:store.users(),entries:store.entries(),audits:store.audits(),note:'As fotos não estão incluídas neste JSON; permanecem no IndexedDB deste navegador.'};downloadBlob(new Blob([JSON.stringify(backup,null,2)],{type:'application/json'}),`backup_ponto_${localDate(new Date())}.json`)}
function downloadBlob(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
async function resetDemo(){if(!confirm('Isso apagará marcações e auditoria desta demonstração e recriará os 15 acessos padrão. Continuar?'))return;localStorage.removeItem(KEYS.users);localStorage.removeItem(KEYS.entries);localStorage.removeItem(KEYS.audits);indexedDB.deleteDatabase(PHOTO_DB);ensureBootstrap();audit('demo_reset','system',null,{});toast('Dados limpos. Os 15 acessos padrão foram recriados com PIN 1234.','ok');render()}


function enhanceMobileTables(root=document){
  root.querySelectorAll('.table-wrap table').forEach(table=>{
    const headers=[...table.querySelectorAll('thead th')].map(th=>th.textContent.trim());
    table.querySelectorAll('tbody tr').forEach(tr=>{
      [...tr.children].forEach((td,i)=>{if(td.tagName==='TD'&&!td.dataset.label)td.dataset.label=headers[i]||''});
    });
  });
}
const mobileTableObserver=new MutationObserver(()=>enhanceMobileTables(document));
mobileTableObserver.observe(document.getElementById('app'),{childList:true,subtree:true});

function render(){ensureBootstrap();const u=currentUser();if(APP.session&&!u){APP.session=null}if(!APP.session){return loginView()}if(isAdmin(u)){if(APP.view==='employee')return employeeView();APP.view='admin';return adminView()}APP.view='employee';return employeeView()}

document.addEventListener('click',async ev=>{
  const t=ev.target.closest('[data-action],[data-photo],[data-admin-tab],[data-approve],[data-reject],[data-edit-entry],[data-delete-entry]');if(!t)return;
  else if(t.dataset.action==='show-login'){APP.view='login';render()}
  else if(t.dataset.action==='logout'){APP.session=null;APP.view='login';render()}
  else if(t.dataset.action==='my-point'){APP.view='employee';render()}
  else if(t.dataset.action==='admin-panel'){APP.view='admin';render()}
  else if(t.dataset.adminTab){APP.adminTab=t.dataset.adminTab;render()}
  else if(t.dataset.photo){await showPhoto(t.dataset.photo)}
  else if(t.dataset.action==='close-photo'){closePhoto()}
  else if(t.dataset.action==='close-dialog'){closeDialog()}
  else if(t.dataset.action==='apply-filter'){sessionStorage.setItem('cbe_filter_date',$('#filterDate').value);sessionStorage.setItem('cbe_filter_emp',$('#filterEmp').value);render()}
  else if(t.dataset.action==='manual-entry'){showManualEntry()}
  else if(t.dataset.action==='export-csv'){exportCsv()}
  else if(t.dataset.action==='download-backup'){downloadBackup()}
  else if(t.dataset.action==='reset-demo'){resetDemo()}
  else if(t.dataset.editEntry){showEditEntry(t.dataset.editEntry)}
  else if(t.dataset.deleteEntry){if(confirm('Excluir esta marcação? A ação ficará registrada na auditoria.')){let entries=store.entries();const x=entries.find(e=>e.id===t.dataset.deleteEntry);entries=entries.filter(e=>e.id!==t.dataset.deleteEntry);store.set(KEYS.entries,entries);audit('punch_deleted','entry',t.dataset.deleteEntry,{employee:x?emp(x.employeeId).name:''});toast('Marcação excluída.','warn');render()}}
});
render();
</script>
</body>
</html>
